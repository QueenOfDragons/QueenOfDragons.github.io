<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="AgoraWord: tessere di lettere e chat della diretta" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2a86"/><stop offset="1" stop-color="#b8487a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e7"/><stop offset="1" stop-color="#f3dfb4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#f2a93b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2a0d3d" flood-opacity=".35"/></filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="120" fill="#ffffff" opacity=".06"/>
  <circle cx="60" cy="300" r="90" fill="#ffffff" opacity=".05"/>
  <!-- chat della diretta -->
  <g filter="url(#sh)">
    <rect x="34" y="40" width="170" height="240" rx="22" fill="#2b1340" opacity=".85"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <circle cx="58" cy="76" r="10" fill="#7fd1c7"/><rect x="74" y="66" width="112" height="22" rx="11" fill="#ffffff" opacity=".14"/>
    <text x="84" y="81" fill="#ffffff" opacity=".85">ciao a tutti!</text>
    <circle cx="58" cy="116" r="10" fill="#ffb35c"/><rect x="74" y="106" width="96" height="22" rx="11" fill="#ffffff" opacity=".14"/>
    <text x="84" y="121" fill="#ffffff" opacity=".85">… tavolo?</text>
    <circle cx="58" cy="156" r="10" fill="#f58fb6"/><rect x="74" y="146" width="112" height="22" rx="11" fill="#ffd86b"/>
    <text x="84" y="161" fill="#3b1d00" font-weight="700">PAROLA ✓</text>
    <circle cx="58" cy="196" r="10" fill="#9ec5ff"/><rect x="74" y="186" width="84" height="22" rx="11" fill="#ffffff" opacity=".14"/>
    <text x="84" y="201" fill="#ffffff" opacity=".85">bravaaa</text>
    <rect x="50" y="236" width="138" height="26" rx="13" fill="#ffffff" opacity=".1"/>
    <text x="64" y="253" fill="#ffffff" opacity=".55">Scrivi in chat…</text>
  </g>
  <!-- tessere -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" text-anchor="middle" fill="#4a2a10">
    <g filter="url(#sh)">
      <rect x="236" y="120" width="56" height="62" rx="10" fill="url(#tile)" transform="rotate(-6 264 151)"/>
      <rect x="298" y="112" width="56" height="62" rx="10" fill="url(#tile)" transform="rotate(3 326 143)"/>
      <rect x="360" y="120" width="56" height="62" rx="10" fill="url(#gold)" transform="rotate(-2 388 151)"/>
      <rect x="422" y="114" width="56" height="62" rx="10" fill="url(#tile)" transform="rotate(5 450 145)"/>
      <rect x="484" y="122" width="56" height="62" rx="10" fill="url(#tile)" transform="rotate(-4 512 153)"/>
      <rect x="546" y="116" width="56" height="62" rx="10" fill="url(#tile)" transform="rotate(4 574 147)"/>
    </g>
    <text x="264" y="166" transform="rotate(-6 264 151)">P</text>
    <text x="326" y="158" transform="rotate(3 326 143)">A</text>
    <text x="388" y="166" transform="rotate(-2 388 151)">R</text>
    <text x="450" y="160" transform="rotate(5 450 145)">O</text>
    <text x="512" y="168" transform="rotate(-4 512 153)">L</text>
    <text x="574" y="162" transform="rotate(4 574 147)">A</text>
  </g>
  <!-- punti -->
  <g filter="url(#sh)">
    <path d="M420 230 l10 20 22 3 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -3z" fill="url(#gold)"/>
  </g>
  <text x="470" y="270" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="#ffffff">+10</text>
  <g fill="#ffffff" opacity=".7">
    <circle cx="250" cy="70" r="3"/><circle cx="600" cy="230" r="4"/><circle cx="330" cy="260" r="2.5"/><circle cx="560" cy="80" r="2.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
